<script>
/* Seite erscheint */
window.addEventListener("load", () => {
  document.body.classList.add("page-loaded");
});

/* sanfter Seitenwechsel */
document.querySelectorAll("a").forEach(link => {
  link.addEventListener("click", function(e) {

    // nur interne Links behandeln
    if (this.hostname === window.location.hostname) {
      e.preventDefault();

      const href = this.href;

      document.body.classList.remove("page-loaded");
      document.body.classList.add("page-leave");

      setTimeout(() => {
        window.location.href = href;
      }, 400);
    }
  });
});
</script>

<script>
/* PAGE LOAD */
window.addEventListener("load", () => {
  document.body.classList.add("page-loaded");

  // gespeicherten State setzen
  const from = sessionStorage.getItem("fromState");
  if (from) {
    document.body.classList.add("from-" + from);
  }
});

/* CLICK HANDLING */
document.querySelectorAll("a").forEach(link => {
  link.addEventListener("click", function(e) {

    if (this.hostname === window.location.hostname) {
      e.preventDefault();

      const href = this.href;

      // aktuellen State speichern (aus URL)
      const current = window.location.pathname.split("/").pop().replace(".html", "");
      sessionStorage.setItem("fromState", current);

      document.body.classList.remove("page-loaded");
      document.body.classList.add("page-leave");

      setTimeout(() => {
        window.location.href = href;
      }, 450);
    }
  });
});
</script>

<script>
/* PAGE LOAD */
window.addEventListener("load", () => {
  document.body.classList.add("page-loaded");

  const from = sessionStorage.getItem("fromState");
  const to = sessionStorage.getItem("toState");

  if (from) document.body.classList.add("from-" + from);
  if (to) document.body.classList.add("to-" + to);
});

/* CLICK HANDLING */
document.querySelectorAll("a").forEach(link => {
  link.addEventListener("click", function(e) {

    if (this.hostname === window.location.hostname) {
      e.preventDefault();

      const href = this.href;

      const current = window.location.pathname
        .split("/")
        .pop()
        .replace(".html", "");

      const target = new URL(href).pathname
        .split("/")
        .pop()
        .replace(".html", "");

      sessionStorage.setItem("fromState", current);
      sessionStorage.setItem("toState", target);

      document.body.classList.remove("page-loaded");
      document.body.classList.add("page-leave");

      setTimeout(() => {
        window.location.href = href;
      }, 450);
    }
  });
});
</script>
